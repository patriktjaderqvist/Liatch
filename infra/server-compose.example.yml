# Production docker-compose for hertznet.
#
# Copy to /srv/projects/liatch/docker-compose.yml on the server alongside an
# `.env` (template at infra/server.env.example). Caddy on the host joins the
# external `web` network and reverse-proxies https://liatch.com to the
# liatch-web container on port 8000 — no host port mapping needed.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: liatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: liatch
    volumes:
      - liatch_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liatch -d liatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    container_name: liatch-web
    image: ghcr.io/patriktjaderqvist/liatch:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - web

volumes:
  liatch_db:

networks:
  web:
    external: true
